 # Alias internal yang dipakai backend; upstream model dapat diganti melalui
 # environment/config tanpa mengubah kode server.
model_list:
  - model_name: copilot-rag
    litellm_params:
      # Authenticator().get_access_token() supplies the GitHub Copilot session.
      # Override with LITELLM_COPILOT_MODEL when the account exposes another
      # included/zero-multiplier model.
      model: os.environ/LITELLM_COPILOT_MODEL

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  # Hermes/OpenAI-compatible clients may send provider-specific fields that
  # GitHub Copilot does not accept (for example reasoning_effort).
  drop_params: true
